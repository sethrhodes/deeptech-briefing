name: Daily Deep-Tech Brief

on:
  schedule:
    # 13:13 UTC = 6:13am PDT / 5:13am PST — odd minute on purpose, GitHub
    # Actions cron is best-effort and top-of-hour runs get delayed most.
    - cron: "13 13 * * 1-5"
  workflow_dispatch: {}   # manual trigger from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required by claude-code-action's default auth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Step 1: gather. Plain Python + HTTP. No LLM, no cost beyond the
      # runner minute.
      - name: Gather RSS + dedup list
        run: python daily_brief.py gather --out brief_input.json
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Step 2: synthesize. This is Claude Code itself, authenticated with
      # CLAUDE_CODE_OAUTH_TOKEN -- draws from your Claude subscription's
      # usage limits, not metered API billing. No ANTHROPIC_API_KEY
      # anywhere in this workflow.
      - name: Synthesize with Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read brief_input.json in the repo root. It has two fields:
            "raw_items" (RSS entries: source, title, link, summary, published)
            and "already_covered" (headlines from the last 14 days -- skip
            anything materially similar to these unless there's a real
            update: a new number, a reversal, a new party involved).

            You are producing a daily deep-tech opportunity brief for a
            mechanical engineer starting a Management Science & Engineering
            master's at Stanford, hunting for a company to start in
            manufacturing, energy, or space.

            Write brief_output.json in the repo root: a JSON array of items,
            each with these exact fields:
              section: one of "problems_surfaced", "funding_signals",
                "technical_breakthroughs", "regulatory_shifts", "hiring_failures"
              headline: short, specific, names the actual company/agency/number
              summary: 1-3 sentences, your own words, no fluff
              founder_note: one sentence -- why this could be a company, or
                what adjacent problem it points to. Omit the field if there's
                genuinely nothing worth saying.
              source_name: the "source" field from the matching raw item
              source_url: the exact "link" field from the matching raw item.
                Never invent a URL -- copy it verbatim, or omit the item if
                it has none.

            Rules:
            - Maximum 15 items total. Cut the weakest before padding.
            - Every item needs a specific claim: a number, a name, a
              technical detail. No "X is exploring Y" vagueness.
            - If nothing in raw_items is worth including, write an empty
              array -- do not force items in to fill it out.
            - Write ONLY the JSON array to the file. No other output needed.
            - Only the Read and Write tools are available. Do not attempt any
              other tool (no Bash, Glob, Grep, LS, TodoWrite, WebFetch). Each
              denied attempt burns a turn for nothing.
          # 20, not 5: the task needs ~3 turns when it goes cleanly, but a
          # run that reaches for a disallowed tool spends turns on denials
          # before recovering. 5 left no headroom -- a run that had already
          # produced correct output was failed on the turn count alone.
          claude_args: '--allowedTools "Read,Write" --max-turns 20'

      # Step 3: write. Plain Python + HTTP again. No LLM.
      - name: Write to Supabase
        run: python daily_brief.py write brief_output.json
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
