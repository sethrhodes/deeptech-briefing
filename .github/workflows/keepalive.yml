# GitHub disables scheduled workflows after 60 days without repository
# activity. This pipeline never commits anything, so without this the daily
# brief would quietly stop firing after two months. One empty commit a month
# keeps the clock reset with ~29 days of margin.
name: Keepalive

on:
  schedule:
    - cron: "27 5 1 * *"   # 05:27 UTC on the 1st of every month
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Empty commit to reset the inactivity timer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — reset GitHub's 60-day scheduled-workflow timer"
          git push
