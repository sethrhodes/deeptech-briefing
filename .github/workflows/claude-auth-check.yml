# Temporary. Bypasses claude-code-action to surface the CLI's own stderr,
# which the action swallows. Delete once the auth question is settled.
name: Claude auth check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Version and flags
        run: |
          claude --version || true
          echo "--- help ---"
          claude --help 2>&1 | head -50 || true
      - name: Minimal prompt, stderr captured
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          echo "token length: ${#CLAUDE_CODE_OAUTH_TOKEN}"
          echo "token prefix: ${CLAUDE_CODE_OAUTH_TOKEN:0:8}"
          claude -p "Reply with exactly: OK" --output-format json > out.json 2> err.txt
          echo "exit=$?"
          echo "--- stdout ---"; cat out.json
          echo "--- stderr ---"; cat err.txt
